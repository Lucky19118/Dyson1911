<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dyson1911 Store</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
    }

    /* HEADER */
    header {
      background: #111;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 22px;
      font-size: 14px;
    }

    nav a:hover {
      color: #aaa;
    }

    /* HERO */
    .hero {
      max-width: 1100px;
      margin: 35px auto;
      padding: 55px 25px;
      text-align: center;
      background: linear-gradient(135deg, #111, #333);
      color: white;
      border-radius: 18px;
    }

    .hero h1 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #ccc;
      font-size: 16px;
    }

    /* CATEGORIES */
    .categories {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .categories h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 28px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .category {
      background: white;
      padding: 28px 15px;
      border-radius: 14px;
      text-align: center;
      text-decoration: none;
      color: #111;
      box-shadow: 0 4px 15px rgba(0,0,0,0.07);
      transition: 0.25s;
    }

    .category:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 22px rgba(0,0,0,0.12);
    }

    .icon {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .category h3 {
      font-size: 18px;
    }

    /* FOOTER */
    footer {
      margin-top: 50px;
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 25px;
      font-size: 13px;
    }

    /* MOBILE */
    @media (max-width: 700px) {

      header {
        padding: 16px 20px;
      }

      nav a {
        margin-left: 10px;
        font-size: 12px;
      }

      .hero {
        margin: 20px;
        padding: 40px 15px;
      }

      .hero h1 {
        font-size: 30px;
      }

      .category-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .category {
        padding: 22px 10px;
      }

      .icon {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="logo">Dyson1911 Store</div>

    <nav>
      <a href="#">Accueil</a>
      <a href="#categories">Collections</a>
    </nav>
  </header>


  <!-- HERO -->
  <section class="hero">
    <h1>Dyson1911 Store</h1>
    <p>Découvrez notre sélection de collections</p>
  </section>


  <!-- CATEGORIES -->
  <section class="categories" id="categories">

    <h2>Nos collections</h2>

    <div class="category-grid">

      <a href="#" class="category">
        <div class="icon">👕</div>
        <h3>Textile</h3>
      </a>

      <a href="#" class="category">
        <div class="icon">👟</div>
        <h3>Chaussures</h3>
      </a>

      <a href="#" class="category">
        <div class="icon">👜</div>
        <h3>Maroquinerie</h3>
      </a>

      <a href="#" class="category">
        <div class="icon">⌚</div>
        <h3>Horlogerie</h3>
      </a>

      <a href="#" class="category">
        <div class="icon">💎</div>
        <h3>Bijoux</h3>
      </a>

      <a href="#" class="category">
        <div class="icon">📱</div>
        <h3>Électronique</h3>
      </a>

    </div>
  </section>


  <!-- FOOTER -->
  <footer>
    © 2026 Dyson1911 Store — Tous droits réservés.
  </footer>

</body>
</html>
